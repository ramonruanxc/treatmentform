name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Core suite (Free Pascal, Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Free Pascal
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc
          fpc -iV

      # The core has no VCL dependency, which is what makes this job possible:
      # Delphi cannot be licensed on a hosted runner, and the Community Edition
      # refuses command line compilation even locally.
      - name: Build core test suite
        run: |
          mkdir -p build
          fpc -Mdelphi \
            -Fusrc/core -Futests/core \
            -FUbuild -obuild/CoreTests \
            tests/core/CoreTests.dpr

      - name: Run core test suite
        run: ./build/CoreTests

  # The VCL layer cannot be compiled here — Delphi is not licensable on a hosted
  # runner and its Community Edition refuses command-line builds even locally —
  # so this job checks the one class of VCL breakage that IS checkable from the
  # repository alone: a unit that requires a form resource whose .dfm was never
  # committed. That exact mistake shipped once; a fresh clone could not build the
  # demo while CI stayed green, because CI only ever touched the core.
  manifest:
    name: Repository manifest (committed files match what the source requires)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Every unit with {$R *.dfm} has its .dfm committed
        run: |
          status=0
          while IFS= read -r unit; do
            dfm="${unit%.pas}.dfm"
            if [ ! -f "$dfm" ]; then
              echo "::error file=$unit::declares {\$R *.dfm} but $dfm is not in the repository"
              status=1
            else
              echo "ok  $unit -> $dfm"
            fi
          done < <(grep -rl --include='*.pas' -F '{$R *.dfm}' . || true)
          exit $status

      - name: Every unit named in a .dpr uses clause exists
        run: |
          status=0
          for dpr in $(find . -name '*.dpr'); do
            dir=$(dirname "$dpr")
            # Pull the 'Unit in '...'' file names out of the uses clause.
            while IFS= read -r rel; do
              [ -z "$rel" ] && continue
              if [ ! -f "$dir/$rel" ]; then
                echo "::error file=$dpr::references '$rel', which is not in the repository"
                status=1
              else
                echo "ok  $dpr -> $rel"
              fi
            done < <(sed -n "s/.*[Ii][Nn] '\([^']*\)'.*/\1/p" "$dpr")
          done
          exit $status
